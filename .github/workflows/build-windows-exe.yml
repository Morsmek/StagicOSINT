name: Build Windows EXE

# Builds SDBA.exe on a native Windows runner (PyInstaller cannot cross-compile
# from Linux). The finished executable is uploaded as a downloadable artifact.
#
# Trigger it manually from the Actions tab ("Run workflow"), or it runs
# automatically on every push to the build branch.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sdba-app-build-ybm1lw
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'requirements.txt'
      - '.github/workflows/build-windows-exe.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Step 1: Build the React frontend ─────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ── Step 2: Python deps + PyInstaller ────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── Step 3: Bundle the single-file executable ────────────────────────
      - name: Build SDBA.exe
        working-directory: backend
        run: pyinstaller SDBA.spec --clean --noconfirm

      # ── Step 4: Publish the executable ───────────────────────────────────
      - name: Upload SDBA.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDBA-windows-exe
          path: backend/dist/SDBA.exe
          if-no-files-found: error
          retention-days: 30
